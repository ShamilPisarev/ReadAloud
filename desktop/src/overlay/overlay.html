<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Select a screen area</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        background: rgba(20, 20, 24, 0.18);
        user-select: none;
        -webkit-user-select: none;
      }
      #hint {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 24, 0.85);
        color: #fff;
        font: 13px system-ui, sans-serif;
        padding: 8px 14px;
        border-radius: 8px;
        pointer-events: none;
      }
      #rect {
        position: fixed;
        border: 2px solid #4f8ef7;
        background: rgba(79, 142, 247, 0.15);
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hint">Drag to select the text to read — Esc to cancel</div>
    <div id="rect"></div>
    <script>
      const rectEl = document.getElementById('rect');
      let startX = 0;
      let startY = 0;
      let dragging = false;

      const bounds = () => ({
        x: Math.min(startX, lastX),
        y: Math.min(startY, lastY),
        width: Math.abs(lastX - startX),
        height: Math.abs(lastY - startY),
      });
      let lastX = 0;
      let lastY = 0;

      window.addEventListener('mousedown', event => {
        if (event.button !== 0) {
          window.overlay.cancel();
          return;
        }
        dragging = true;
        startX = lastX = event.clientX;
        startY = lastY = event.clientY;
        rectEl.style.display = 'block';
      });

      window.addEventListener('contextmenu', event => event.preventDefault());

      window.addEventListener('mousemove', event => {
        if (!dragging) return;
        lastX = event.clientX;
        lastY = event.clientY;
        const b = bounds();
        rectEl.style.left = b.x + 'px';
        rectEl.style.top = b.y + 'px';
        rectEl.style.width = b.width + 'px';
        rectEl.style.height = b.height + 'px';
      });

      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        window.overlay.complete(bounds());
      });

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') window.overlay.cancel();
      });
    </script>
  </body>
</html>
